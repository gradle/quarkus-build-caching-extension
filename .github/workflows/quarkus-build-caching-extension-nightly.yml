name: Verify Quarkus Build Caching Extension (Nightly)
permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    paths:
      - ".github/workflows/quarkus-build-caching-extension-nightly.yml"
  workflow_dispatch:

jobs:
  # The augmentation output is the cache key, so a Quarkus change that makes it less reproducible
  # stops the native image ever being reused. This is what catches that before a release does.
  # GraalVM rather than a plain JDK: the in-host project builds the native image on the runner.
  quarkus-snapshot:
    name: Quarkus snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up GraalVM 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '25'
          distribution: 'graalvm-community'
      - name: Install Quarkus snapshots
        uses: quarkusio/install-quarkus-snapshots-action@de83c2a9a1528f92fa835160b1239c5bdb680ded # main
      - name: Build with Maven
        run: |
          ./mvnw --batch-mode clean package integration-test -Dinvoker.test=quarkus-latest-in-container,quarkus-latest-in-host
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_SOLUTIONS_ACCESS_KEY }}
      - name: Upload integration tests reports (on failure only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Integration tests logs (Quarkus snapshot)
          path: |
            target/it/**/*.log

  # Caching a native image built outside a container leaves the toolchain out of the key, so this
  # path is only exercised where a local native-image is installed.
  local-toolchain:
    name: Local toolchain native build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up GraalVM 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '25'
          distribution: 'graalvm-community'
      - name: Build with Maven
        run: |
          ./mvnw --batch-mode clean package integration-test -Dinvoker.test=quarkus-3.39.3-in-host
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DV_SOLUTIONS_ACCESS_KEY }}
      - name: Upload integration tests reports (on failure only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Integration tests logs (local toolchain)
          path: |
            target/it/**/*.log

  failure-notification:
    name: Matrix failure notification
    runs-on: ubuntu-latest
    needs: [quarkus-snapshot, local-toolchain]
    if: failure()
    steps:
      - name: Get secrets
        uses: gradle/actions-internal/get-aws-secrets@13e203b1ec5f0fc7784cf0c7f518376c23713380 # v1
        with:
          role-to-assume: arn:aws:iam::992382829881:role/GHASecrets_quarkus-build-caching-extension_all
          secret-ids: |
            DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL,gha/quarkus-build-caching-extension/_all/dv_solutions_scheduled_workflows_webhook_url
      - name: Report scheduled workflow failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload-templated: true
          payload: |
            {
              "workflow_name": "Quarkus Cache: Verify Quarkus Build Caching Extension (Nightly)",
              "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
