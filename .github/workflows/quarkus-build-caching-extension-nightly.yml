name: Verify Quarkus Build Caching Extension (Nightly)
permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    paths:
      - ".github/workflows/quarkus-build-caching-extension-nightly.yml"
  workflow_dispatch:

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Quarkus snapshots
        uses: quarkusio/install-quarkus-snapshots-action@de83c2a9a1528f92fa835160b1239c5bdb680ded # main
      - name: Get GitHub OIDC token for Develocity
        id: develocity-oidc
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          # Exchange the OIDC token for a short-lived Develocity access token, for builds that read DEVELOCITY_ACCESS_KEY directly
          access_token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $token" \
            "https://ge.solutions-team.gradle.com/api/auth/token?expiresInHours=2")
          echo "::add-mask::$access_token"
          echo "token-access-key=ge.solutions-team.gradle.com=$access_token" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: |
          ./mvnw --batch-mode clean package integration-test -Dinvoker.test=quarkus-latest
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
      - name: Upload integration tests reports (on failure only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Integration tests logs
          path: |
            target/it/**/*.log

  failure-notification:
    name: Matrix failure notification
    runs-on: ubuntu-latest
    needs: verification
    if: failure()
    steps:
      - name: Get secrets
        uses: gradle/actions-internal/get-aws-secrets@13e203b1ec5f0fc7784cf0c7f518376c23713380 # v1
        with:
          role-to-assume: arn:aws:iam::992382829881:role/GHASecrets_quarkus-build-caching-extension_all
          secret-ids: |
            DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL,gha/quarkus-build-caching-extension/_all/dv_solutions_scheduled_workflows_webhook_url
      - name: Report scheduled workflow failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload-templated: true
          payload: |
            {
              "workflow_name": "Quarkus Cache: Verify Quarkus Build Caching Extension (Nightly)",
              "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
