name: Verify Quarkus Build Caching Extension (Nightly)
permissions:
  contents: read
  id-token: write

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    paths:
      - ".github/workflows/quarkus-build-caching-extension-nightly.yml"
  workflow_dispatch:

jobs:
  # The augmentation output is the cache key, so a Quarkus change that makes it less reproducible
  # stops the native image ever being reused. This is what catches that before a release does.
  # Mandrel rather than a plain JDK: the in-host project builds the native image on the runner.
  # Latest Mandrel, not setup-java's graalvm-community (stuck on 25.0.2), as Quarkus rejects native
  # toolchains older than the version it currently supports. Same for the local-toolchain job.
  quarkus-snapshot:
    name: Quarkus snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Mandrel 25
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          distribution: 'mandrel'
      - name: Install Quarkus snapshots
        uses: quarkusio/install-quarkus-snapshots-action@de83c2a9a1528f92fa835160b1239c5bdb680ded # main
      - name: Get GitHub OIDC token for Develocity
        id: develocity-oidc
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          # Exchange the OIDC token for a short-lived Develocity access token, for builds that read DEVELOCITY_ACCESS_KEY directly
          access_token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $token" \
            "https://solutions.develocity.cloud/api/auth/token?expiresInHours=2")
          echo "::add-mask::$access_token"
          echo "token-access-key=solutions.develocity.cloud=$access_token" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: |
          ./mvnw --batch-mode clean package integration-test -Dinvoker.test=quarkus-latest-in-container,quarkus-latest-in-host
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
      - name: Upload integration tests reports (on failure only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Integration tests logs (Quarkus snapshot)
          path: |
            target/it/**/*.log

  # Caching a native image built outside a container leaves the toolchain out of the key, so this
  # path is only exercised where a local native-image is installed.
  local-toolchain:
    name: Local toolchain native build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Mandrel 25
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          distribution: 'mandrel'
      - name: Get GitHub OIDC token for Develocity
        id: develocity-oidc
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          # Exchange the OIDC token for a short-lived Develocity access token, for builds that read DEVELOCITY_ACCESS_KEY directly
          access_token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $token" \
            "https://solutions.develocity.cloud/api/auth/token?expiresInHours=2")
          echo "::add-mask::$access_token"
          echo "token-access-key=solutions.develocity.cloud=$access_token" >> "$GITHUB_OUTPUT"
      - name: Build with Maven
        run: |
          ./mvnw --batch-mode clean package integration-test -Dinvoker.test=quarkus-3.39.3-in-host
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
      - name: Upload integration tests reports (on failure only)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Integration tests logs (local toolchain)
          path: |
            target/it/**/*.log

  failure-notification:
    name: Matrix failure notification
    runs-on: ubuntu-latest
    needs: [quarkus-snapshot, local-toolchain]
    if: failure()
    steps:
      - name: Get secrets
        uses: gradle/actions-internal/get-aws-secrets@13e203b1ec5f0fc7784cf0c7f518376c23713380 # v1
        with:
          role-to-assume: arn:aws:iam::992382829881:role/GHASecrets_quarkus-build-caching-extension_all
          secret-ids: |
            DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL,gha/quarkus-build-caching-extension/_all/dv_solutions_scheduled_workflows_webhook_url
      - name: Report scheduled workflow failure
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ env.DV_SOLUTIONS_SCHEDULED_WORKFLOWS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload-templated: true
          payload: |
            {
              "workflow_name": "Quarkus Cache: Verify Quarkus Build Caching Extension (Nightly)",
              "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
