# A project declaring one build execution. Only a split native build is cacheable, so this one has
# to be left alone on every build, however many times it runs.

invoker.name.1 = Single build execution, not cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-single-execution.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Single build execution, still not cacheable on a rebuild
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-single-execution-rebuild.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug
