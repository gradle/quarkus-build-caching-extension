# A native build using the local GraalVM rather than a container, which the extension only caches
# once the in-container requirement is lifted. Excluded from the default run: it needs a local
# native-image on PATH or GRAALVM_HOME. The nightly workflow installs one and runs it with
# -Dinvoker.test=quarkus-native-local-toolchain.

invoker.name.1 = Local toolchain native build, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-local-toolchain-cacheable.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Local toolchain native build, native image cache hit
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-local-toolchain-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.3 = Local toolchain native build with the in-container requirement left in place
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-local-toolchain-in-container-required.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Ddevelocity.quarkus.native.build.in.container.required=true
