# A native build split into two executions of the Quarkus build goal: the augmentation
# (quarkus-jar, always executed) and the native image generation (quarkus-native-image, cached).
# Note that no .quarkus/quarkus-prod-config-dump is checked in: the augmentation records it on
# every build, and that is the only dump the native image generation keys on.

invoker.name.1 = Split native build, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-split-native-build-cacheable.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Split native build, native image cache hit
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-split-native-build-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.3 = Split native build with a changed compile classpath, native image cache hit
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-split-native-build-changed-classpath-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dextra-compile-dependency

invoker.name.4 = Split native build with caching disabled
invoker.goals.4 = clean package ${develocity-options} --no-snapshot-updates --log-file ./04-split-native-build-cache-disabled.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dcache-disabled

# Without a native build the augmentation produces no native-sources, so the second execution has
# nothing to key on
invoker.name.5 = Split native build layout with the native build disabled
invoker.goals.5 = clean package ${develocity-options} --no-snapshot-updates --log-file ./05-split-native-build-native-disabled.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.native.enabled=false

# quarkus.native.compression.enabled reaches neither the jar nor native-image.args, but the
# augmentation records it, so it has to invalidate the native image generation
invoker.name.6 = Split native build with a changed Quarkus property absent from native-image.args, cache miss
invoker.goals.6 = clean package ${develocity-options} --no-snapshot-updates --log-file ./06-split-native-build-changed-config-cache-miss.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.native.compression.enabled=false

# Without config tracking the dump is not rewritten, so the one left on disk was recorded by an
# earlier build and says nothing about this one
invoker.name.7 = Split native build whose configuration dump was not recorded by the augmentation
invoker.goals.7 = clean package ${develocity-options} --no-snapshot-updates --log-file ./07-split-native-build-stale-config-dump.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.config-tracking.enabled=false

# @QuarkusIntegrationTest launches whatever target/quarkus-artifact.properties describes, and the
# augmentation writes it as type=native-sources. Case 9 repeats case 8 unchanged, so the native image
# comes from the cache and the execution that would have corrected the descriptor never runs: it is
# only right because the restore-quarkus-artifact-descriptor step put it back.
invoker.name.8 = Split native build, artifact descriptor describes the executable
invoker.goals.8 = clean package ${develocity-options} --no-snapshot-updates --log-file ./08-split-native-build-artifact-descriptor.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.9 = Split native build, artifact descriptor still describes the executable on a cache hit
invoker.goals.9 = clean package ${develocity-options} --no-snapshot-updates --log-file ./09-split-native-build-artifact-descriptor-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

# Case 4 disables caching through a pom property. This one passes the same setting on the command
# line, which only reaches the extension because it looks the key up in the system properties too.
invoker.name.10 = Split native build with caching disabled from the command line
invoker.goals.10 = clean package ${develocity-options} --no-snapshot-updates --log-file ./10-split-native-build-cache-disabled-cli.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Ddevelocity.quarkus.cache.enabled=false

# The extension registers track-config-changes and enables config tracking itself, so the pom only
# declares the two build executions. This checks it leaves an explicit declaration alone.
invoker.name.11 = Split native build declaring the config tracking goal itself
invoker.goals.11 = clean package ${develocity-options} --no-snapshot-updates --log-file ./11-split-native-build-explicit-config-tracking.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dexplicit-config-tracking

# Quarkus writes META-INF/native-image/*.json from unordered collections, so the extension orders them
# before the next execution is keyed on the jar. It can be turned off.
invoker.name.12 = Split native build with the native-image configuration ordering disabled
invoker.goals.12 = clean package ${develocity-options} --no-snapshot-updates --log-file ./12-split-native-build-no-json-ordering.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Ddevelocity.quarkus.normalize.native.image.config=false

# With a version that moves every commit the cache key would move with it. The extension builds under a
# name without the version, drops the Maven descriptor from the jar it keys on, and links the executable
# back to the name it would have had.
invoker.name.13 = Split native build keeping the project version out of the cache key
invoker.goals.13 = clean package ${develocity-options} --no-snapshot-updates --log-file ./13-split-native-build-version-independent.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dversion-independent
