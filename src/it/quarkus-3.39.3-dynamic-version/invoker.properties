# A project whose version carries a commit id, so every build is a different version. Without the
# recipe the version reaches the jar the native image generation is keyed on and nothing is ever
# reused; with it, two builds of different versions share one cache entry.

invoker.name.1 = Moving version, first commit, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-first-commit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dsha1=abc1234

invoker.name.2 = Moving version, second commit, native image cache hit across the version change
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-second-commit-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dsha1=def5678

invoker.name.3 = Moving version with the recipe turned off, the version moves the cache key again
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-third-commit-recipe-off.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dsha1=9999999 -Ddevelocity.quarkus.version.independent.build=false
