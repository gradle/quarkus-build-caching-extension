# A native build split into two executions of the Quarkus build goal: the augmentation
# (quarkus-jar, always executed) and the native image generation (quarkus-native-image, cached).
# Note that no .quarkus/quarkus-prod-config-dump is checked in: the augmentation records it on
# every build, and that is the only dump the native image generation keys on.

invoker.name.1 = Split native build, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-split-native-build-cacheable.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Split native build, native image cache hit
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-split-native-build-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.3 = Split native build with a changed compile classpath, native image cache hit
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-split-native-build-changed-classpath-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dextra-compile-dependency

invoker.name.4 = Split native build with caching disabled
invoker.goals.4 = clean package ${develocity-options} --no-snapshot-updates --log-file ./04-split-native-build-cache-disabled.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dcache-disabled

# Without a native build the augmentation produces no native-sources, so the second execution has
# nothing to key on
invoker.name.5 = Split native build layout with the native build disabled
invoker.goals.5 = clean package ${develocity-options} --no-snapshot-updates --log-file ./05-split-native-build-native-disabled.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.native.enabled=false

# quarkus.native.compression.enabled reaches neither the jar nor native-image.args, but the
# augmentation records it, so it has to invalidate the native image generation
invoker.name.6 = Split native build with a changed Quarkus property absent from native-image.args, cache miss
invoker.goals.6 = clean package ${develocity-options} --no-snapshot-updates --log-file ./06-split-native-build-changed-config-cache-miss.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.native.compression.enabled=false

# Without config tracking the dump is not rewritten, so the one left on disk was recorded by an
# earlier build and says nothing about this one
invoker.name.7 = Split native build whose configuration dump was not recorded by the augmentation
invoker.goals.7 = clean package ${develocity-options} --no-snapshot-updates --log-file ./07-split-native-build-stale-config-dump.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Dquarkus.config-tracking.enabled=false
