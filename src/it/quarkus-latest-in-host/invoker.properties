# The local toolchain native build against the Quarkus snapshot: no container, so the extension only
# caches it once the in-container requirement is lifted. Excluded from the default run, it needs both
# the Quarkus snapshots installed and a local native-image on PATH or GRAALVM_HOME. The nightly
# workflow provides both and runs it with -Dinvoker.test=quarkus-latest-in-host.

invoker.name.1 = Snapshot local toolchain native build, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-local-toolchain-cacheable.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Snapshot local toolchain native build, native image cache hit
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-local-toolchain-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.3 = Snapshot local toolchain native build with the in-container requirement left in place
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-local-toolchain-in-container-required.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Ddevelocity.quarkus.native.build.in.container.required=true
