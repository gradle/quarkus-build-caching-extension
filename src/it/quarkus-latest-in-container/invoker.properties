# The same split native build against the Quarkus snapshot, in the plain configuration: in-container,
# no dynamic version, nothing opted into. Excluded from the default run since 999-SNAPSHOT only
# resolves once the Quarkus snapshots have been installed; the nightly workflow runs it with
# -Dinvoker.test=quarkus-latest.

invoker.name.1 = Split native build against the Quarkus snapshot, native image generation is cacheable
invoker.goals.1 = clean package ${develocity-options} --no-snapshot-updates --log-file ./01-latest-cacheable.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.2 = Split native build against the Quarkus snapshot, native image cache hit
invoker.goals.2 = clean package ${develocity-options} --no-snapshot-updates --log-file ./02-latest-cache-hit.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug

invoker.name.3 = Split native build against the Quarkus snapshot with caching disabled
invoker.goals.3 = clean package ${develocity-options} --no-snapshot-updates --log-file ./03-latest-cache-disabled.log -Dorg.slf4j.simpleLogger.log.com.gradle=debug -Ddevelocity.quarkus.cache.enabled=false
